site_name: DYNAMIXEL-X430-Control-Table-Emulator
site_description: >-
  Device-side emulation of DYNAMIXEL X430 actuators over Protocol 2.0 in portable C11:
  the firmware drives any motor, the host sees a genuine X430. No heap, no RTOS,
  MISRA C:2012, 100 % test coverage.
site_author: Anton Vynohradov
site_url: https://antonvynohradov.github.io/DYNAMIXEL-X430-Control-Table-Emulator/   # GitHub Pages path = repository name
repo_url: https://github.com/AntonVynohradov/DYNAMIXEL-X430-Control-Table-Emulator
repo_name: AntonVynohradov/DYNAMIXEL-X430-Control-Table-Emulator
edit_uri: ""
copyright: >-
  Copyright &copy; 2026 Anton Vynohradov ·
  <a href="https://systemfromscratch.com">SystemFromScratch®</a> ·
  Licensed under the <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache License 2.0</a>

nav:
  - Home: index.md
  - Guide:
      - Introduction: overview.md
      - Getting Started: guide.md
      - How It Works: architecture.md
      - Using the Library: usage.md
      - Extending the Library: extending.md
      - Configuration: configuration.md
  - X430 Emulation: theory.md
  - Integration: integration.md
  - Reference:
      - API Reference: api.md
      - Doxygen:
          - Modules: reference/modules.md
          - Files: reference/files.md
          - Data Structures: reference/annotated.md
          - Functions: reference/functions.md
          - Macros: reference/macros.md
      - MISRA C:2012: misra.md
      - Changelog: changelog.md
  - About:
      - Author & Company: about.md
      - License: LICENSE.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/brand/systemfromscratch-logo-on-dark.png
  favicon: assets/images/brand/systemfromscratch-logo.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra:
  generator: false
  # Header download button (overrides/partials/header.html); the PDF is built by CI
  manual_pdf: downloads/DYNAMIXEL-X430-Control-Table-Emulator_User_Manual.pdf
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AntonVynohradov
      name: Anton Vynohradov on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/vynohradov
      name: Anton Vynohradov on LinkedIn
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0005-6965-0911
      name: Anton Vynohradov on ORCID
    - icon: material/web
      link: https://systemfromscratch.com
      name: SystemFromScratch®

  # ---------------------------------------------------------------- landing page
  # Rendered by overrides/home.html. Story: hero -> the problem (3 problem->solution
  # cards) -> what you get (6 linked cards) -> measured stats -> quick start
  # (docs/index.md) -> SystemFromScratch® portfolio banner. See references/website.md.
  landing:
    eyebrow: Open-source embedded library
    title: Any motor as a DYNAMIXEL X430
    accent: in portable C
    lead: >-
      The X430 emulator turns DYNAMIXEL Protocol 2.0 packets into the Control Table of a
      genuine X430 and into hook calls for your motor, so DynamixelSDK, DYNAMIXEL Wizard
      and ROS 2 drive a stepper or a BLDC unchanged, with no heap, no RTOS and code that
      passes MISRA C:2012.
    hero_image: assets/images/hero-3d.svg
    hero_alt: >-
      Isometric scene: a host adapter sends Protocol 2.0 packets over the bus to a
      controller board; the X430 emulator chip answers and drives a stepper motor through
      its power stage
    buttons:
      - {text: Get started, link: guide/, style: primary}
      - {text: View on GitHub, link: "https://github.com/AntonVynohradov/DYNAMIXEL-X430-Control-Table-Emulator", style: outline}
    features:
      - {icon: chip, line1: No heap, line2: No RTOS}
      - {icon: shield, line1: MISRA C:2012, line2: 0 violations}
      - {icon: flask, line1: 100 % line &, line2: branch coverage}
      - {icon: code, line1: Apache-2.0, line2: open source}
    problem:
      eyebrow: The problem
      title: Your own actuator, the DYNAMIXEL tools you already use
      intro: >-
        A robot arm built around a stepper or a BLDC driver needs a host protocol. Writing
        one means a host driver, a ROS 2 plugin and a configuration tool of your own.
        Answering as a DYNAMIXEL X430 instead gives you DynamixelSDK, DYNAMIXEL Wizard and
        dynamixel_hardware_interface — if the device behaves like a real X430 down to the
        rules of its Control Table, inside the RAM and flash of a small MCU.
      cards:
        - icon: wave
          title: Behaves like the real actuator
          text: >-
            All 17 X430 models with Control Tables generated from YAML and checked against
            the e-Manual; every instruction a host uses, Indirect Address, Bus Watchdog,
            shutdown, backup. 52 checks with the official DynamixelSDK pass end to end.
          tags: [Protocol 2.0, Fast Sync Read, Indirect Address]
        - icon: memory
          title: Tight embedded budgets
          text: >-
            1,400 B of RAM per device and 3,128 B per bus on Cortex-M4, 11.2 KB of flash
            at -Os including the model table; no allocation, no globals, no OS.
          tags: [Static memory, Bare metal & RTOS]
        - icon: shield
          title: Code you can certify
          text: >-
            Zero MISRA C:2012 violations, a documented deviation register, 100 % line
            and branch coverage, bounded execution time and static analysis in CI.
          tags: [MISRA C, Cppcheck, CodeQL]
    offer:
      eyebrow: What you get
      title: One library from the serial bytes to your motor
      intro: >-
        24 public functions in three parts — the bus that decodes the line, the devices
        that hold the Control Tables, and an optional simulator — one model per build,
        optional instructions selected with Kconfig or plain definitions.
      cards:
        - {icon: layers, title: The Control Table of a real X430, text: "Access rights, ranges and limit registers, EEPROM lock, REG_WRITE/ACTION, Secondary ID, Status Return Level, Return Delay Time.", tags: [17 models, Generated tables], link: theory/}
        - {icon: gauge, title: Group and Fast reads, text: "SYNC, BULK, FAST_SYNC and FAST_BULK reads and writes, as ROS 2 uses them with Indirect Address.", tags: [SYNC, BULK, FAST], link: theory/#group-instructions}
        - {icon: plug, title: Any motor, any board, text: "One byte writer, an optional port (lock, clock, delay) and five hooks per device connect it to your firmware.", tags: [Hooks, Zephyr, FreeRTOS, Bare metal], link: integration/}
        - {icon: lock, title: The safety rules of the actuator, text: "Hardware error shutdown, Bus Watchdog, goal synchronisation on torque on, and a persistent EEPROM area with CRC.", tags: [Shutdown, Watchdog, Persistence], link: usage/}
        - {icon: document, title: Complete documentation, text: "Guides, the theory with measured results, the integration guide and a full API reference, also as a PDF.", tags: [API, Guides, PDF], link: api/}
        - {icon: check, title: Quality gates in CI, text: "Unit tests (and model-based tests) with a 100 % coverage gate, MISRA C:2012 gate, Cppcheck and CodeQL.", tags: [GoogleTest, Coverage, MISRA C], link: misra/}
    stats:                                   # measured values only
      - {value: "24", label: public functions}
      - {value: "1,400 B", label: RAM per device (Cortex-M4)}
      - {value: "1,796 B", label: worst-case stack (Cortex-M4)}
      - {value: "0", label: MISRA C:2012 violations}
    portfolio:
      title: Part of an open-source embedded portfolio
      text: >-
        The X430 emulator is developed by Anton Vynohradov under SystemFromScratch® — embedded
        software and hardware built from the first schematic to certification.
      buttons:
        - {text: SystemFromScratch®, link: "https://systemfromscratch.com", style: primary}
        - {text: About the author, link: about/, style: outline}
    trademark: >-
      SystemFromScratch® is a registered trademark. DYNAMIXEL and ROBOTIS are trademarks
      of ROBOTIS Co., Ltd.; this independent implementation is not affiliated with or
      endorsed by ROBOTIS.

  # ---------------------------------------------------------------- PDF manual
  # Read by tools/docs/build_manual.py. See references/pdf-manual.md.
  manual:
    title: X430 Emulator
    subtitle: DYNAMIXEL X430 Control Table Emulator in portable C
    version_header: x430.h
    version_macro: X430_VERSION
    output: build/manual/DYNAMIXEL-X430-Control-Table-Emulator_User_Manual_v{version}.pdf
    eyebrow: Open-source embedded library
    cover_image: assets/images/hero-3d.svg
    appendices: [changelog.md, LICENSE.md]
    unnumbered: [about.md]
    web_only: [index.md, reference/]
    keywords: DYNAMIXEL, X430, Protocol 2.0, Control Table, emulator, embedded, C, MISRA C:2012
    vendor_trademarks: >-
      DYNAMIXEL and ROBOTIS are trademarks of ROBOTIS Co., Ltd. STM32 is a registered
      trademark of STMicroelectronics International N.V. Product names are used only to
      identify the emulated devices and the test hardware; DYNAMIXEL-X430-Control-Table-Emulator
      is not affiliated with or endorsed by ROBOTIS or STMicroelectronics.

extra_css:
  - assets/stylesheets/extra.css
  - https://unpkg.com/katex@0.16.9/dist/katex.min.css

extra_javascript:                          # formulas ($...$, $$...$$) on the website
  - assets/javascripts/katex.js
  - https://unpkg.com/katex@0.16.9/dist/katex.min.js
  - https://unpkg.com/katex@0.16.9/dist/contrib/auto-render.min.js

plugins:
  - search
  - autorefs
  - mkdoxy:
      projects:
        reference:
          src-dirs: x430.h inc src
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.c *.h"
            RECURSIVE: True
            EXTRACT_STATIC: True
            JAVADOC_AUTOBRIEF: True

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
