# ==============================================================================
# DYNAMIXEL X430 family: common Control Table (Protocol 2.0)
#
# Source: ROBOTIS e-Manual, X-series model pages (control table of EEPROM and
# RAM area), https://emanual.robotis.com/docs/en/dxl/x/ - transcribed for every
# X430 model and reduced to one table plus per-model overrides in
# models/x430/<model>.yaml.
#
# Register keys
#   name      Data name as used by ROBOTIS (and by dynamixel_hardware_interface)
#   address   Control Table address
#   size      1, 2 or 4 bytes
#   area      eeprom | ram
#   access    r | rw
#   initial   Initial value after a factory reset (live registers: 0)
#   signed    true for two's complement values
#   check     Write check, one of:
#               range        min .. max
#               mask         value & ~mask == 0
#               opmode       one of the model's operating_modes
#               symmetric    -ref .. +ref (ref = address of the limit register)
#               goal_position  Min/Max Position Limit in mode 3, +-1,048,575 otherwise
#               indirect     Indirect Address: RAM address, 64 .. table end
#               none         no value check (read-only registers)
#   goal      true: becomes read-only while Bus Watchdog reports an error
#   variant   current | load : register exists only in that variant
#
# Variants
#   current   XM, XH, XD, XW: Current Limit, Goal Current, Present Current
#   load      XL, XC, 2XL, 2XC: no current control, Present Load instead
#
# SPDX-License-Identifier: Apache-2.0
# ==============================================================================

family: x430
table_size: 662

indirect:
  - {address: 168, data: 224, count: 28}
  - {address: 578, data: 634, count: 28}

registers:
  # ------------------------------------------------------------------ EEPROM
  - {name: Model Number,          address: 0,  size: 2, area: eeprom, access: r,  initial: model, check: none}
  - {name: Model Information,     address: 2,  size: 4, area: eeprom, access: r,  initial: 0,     check: none}
  - {name: Firmware Version,      address: 6,  size: 1, area: eeprom, access: r,  initial: firmware, check: none}
  - {name: ID,                    address: 7,  size: 1, area: eeprom, access: rw, initial: 1,     check: range, min: 0, max: 252}
  - {name: Baud Rate,             address: 8,  size: 1, area: eeprom, access: rw, initial: 1,     check: range, min: 0, max: 7}
  - {name: Return Delay Time,     address: 9,  size: 1, area: eeprom, access: rw, initial: 250,   check: range, min: 0, max: 254}
  - {name: Drive Mode,            address: 10, size: 1, area: eeprom, access: rw, initial: 0,     check: mask, mask: 0x0D}
  - {name: Operating Mode,        address: 11, size: 1, area: eeprom, access: rw, initial: 3,     check: opmode}
  - {name: Secondary(Shadow) ID,  address: 12, size: 1, area: eeprom, access: rw, initial: 255,   check: range, min: 0, max: 255}
  # Only Protocol 2.0 is emulated, so Protocol Type accepts 2 only.
  - {name: Protocol Type,         address: 13, size: 1, area: eeprom, access: rw, initial: 2,     check: range, min: 2, max: 2}
  - {name: Homing Offset,         address: 20, size: 4, area: eeprom, access: rw, initial: 0,     check: range, min: -1044479, max: 1044479, signed: true}
  - {name: Moving Threshold,      address: 24, size: 4, area: eeprom, access: rw, initial: 10,    check: range, min: 0, max: 1023}
  - {name: Temperature Limit,     address: 31, size: 1, area: eeprom, access: rw, initial: 80,    check: range, min: 0, max: 100}
  - {name: Max Voltage Limit,     address: 32, size: 2, area: eeprom, access: rw, initial: 160,   check: range, min: 95, max: 160}
  - {name: Min Voltage Limit,     address: 34, size: 2, area: eeprom, access: rw, initial: 95,    check: range, min: 95, max: 160}
  - {name: PWM Limit,             address: 36, size: 2, area: eeprom, access: rw, initial: 885,   check: range, min: 0, max: 885}
  - {name: Current Limit,         address: 38, size: 2, area: eeprom, access: rw, initial: 1193,  check: range, min: 0, max: 1193, variant: current}
  - {name: Velocity Limit,        address: 44, size: 4, area: eeprom, access: rw, initial: 200,   check: range, min: 0, max: 1023}
  - {name: Max Position Limit,    address: 48, size: 4, area: eeprom, access: rw, initial: 4095,  check: range, min: 0, max: 4095}
  - {name: Min Position Limit,    address: 52, size: 4, area: eeprom, access: rw, initial: 0,     check: range, min: 0, max: 4095}
  - {name: Startup Configuration, address: 60, size: 1, area: eeprom, access: rw, initial: 0,     check: mask, mask: 0x03}
  - {name: Shutdown,              address: 63, size: 1, area: eeprom, access: rw, initial: 52,    check: mask, mask: 0x3D}
  # --------------------------------------------------------------------- RAM
  - {name: Torque Enable,         address: 64, size: 1, area: ram, access: rw, initial: 0,  check: range, min: 0, max: 1}
  - {name: LED,                   address: 65, size: 1, area: ram, access: rw, initial: 0,  check: range, min: 0, max: 1}
  - {name: Status Return Level,   address: 68, size: 1, area: ram, access: rw, initial: 2,  check: range, min: 0, max: 2}
  - {name: Registered Instruction, address: 69, size: 1, area: ram, access: r, initial: 0,  check: none}
  - {name: Hardware Error Status, address: 70, size: 1, area: ram, access: r,  initial: 0,  check: none}
  - {name: Velocity I Gain,       address: 76, size: 2, area: ram, access: rw, initial: 1920, check: range, min: 0, max: 16383}
  - {name: Velocity P Gain,       address: 78, size: 2, area: ram, access: rw, initial: 100,  check: range, min: 0, max: 16383}
  - {name: Position D Gain,       address: 80, size: 2, area: ram, access: rw, initial: 0,    check: range, min: 0, max: 16383}
  - {name: Position I Gain,       address: 82, size: 2, area: ram, access: rw, initial: 0,    check: range, min: 0, max: 16383}
  - {name: Position P Gain,       address: 84, size: 2, area: ram, access: rw, initial: 800,  check: range, min: 0, max: 16383}
  - {name: Feedforward 2nd Gain,  address: 88, size: 2, area: ram, access: rw, initial: 0,    check: range, min: 0, max: 16383}
  - {name: Feedforward 1st Gain,  address: 90, size: 2, area: ram, access: rw, initial: 0,    check: range, min: 0, max: 16383}
  # 0 = off, 1..127 = timeout in 20 ms units; -1 (0xFF) = Bus Watchdog error (set by the device).
  - {name: Bus Watchdog,          address: 98, size: 1, area: ram, access: rw, initial: 0,    check: range, min: 0, max: 127}
  - {name: Goal PWM,              address: 100, size: 2, area: ram, access: rw, initial: 0, check: symmetric, ref: 36, signed: true, goal: true}
  - {name: Goal Current,          address: 102, size: 2, area: ram, access: rw, initial: 0, check: symmetric, ref: 38, signed: true, goal: true, variant: current}
  - {name: Goal Velocity,         address: 104, size: 4, area: ram, access: rw, initial: 0, check: symmetric, ref: 44, signed: true, goal: true}
  - {name: Profile Acceleration,  address: 108, size: 4, area: ram, access: rw, initial: 0, check: range, min: 0, max: 32767}
  - {name: Profile Velocity,      address: 112, size: 4, area: ram, access: rw, initial: 0, check: range, min: 0, max: 32767}
  - {name: Goal Position,         address: 116, size: 4, area: ram, access: rw, initial: 0, check: goal_position, signed: true, goal: true}
  - {name: Realtime Tick,         address: 120, size: 2, area: ram, access: r, initial: 0, check: none}
  - {name: Moving,                address: 122, size: 1, area: ram, access: r, initial: 0, check: none}
  - {name: Moving Status,         address: 123, size: 1, area: ram, access: r, initial: 0, check: none}
  - {name: Present PWM,           address: 124, size: 2, area: ram, access: r, initial: 0, check: none, signed: true}
  - {name: Present Current,       address: 126, size: 2, area: ram, access: r, initial: 0, check: none, signed: true, variant: current}
  - {name: Present Load,          address: 126, size: 2, area: ram, access: r, initial: 0, check: none, signed: true, variant: load}
  - {name: Present Velocity,      address: 128, size: 4, area: ram, access: r, initial: 0, check: none, signed: true}
  - {name: Present Position,      address: 132, size: 4, area: ram, access: r, initial: 0, check: none, signed: true}
  - {name: Velocity Trajectory,   address: 136, size: 4, area: ram, access: r, initial: 0, check: none, signed: true}
  - {name: Position Trajectory,   address: 140, size: 4, area: ram, access: r, initial: 0, check: none, signed: true}
  - {name: Present Input Voltage, address: 144, size: 2, area: ram, access: r, initial: 0, check: none}
  - {name: Present Temperature,   address: 146, size: 1, area: ram, access: r, initial: 0, check: none}
  - {name: Backup Ready,          address: 147, size: 1, area: ram, access: r, initial: 0, check: none}
