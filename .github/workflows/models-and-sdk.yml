# DYNAMIXEL-X430-Control-Table-Emulator: DYNAMIXEL X430 Control Table Emulator
#
# Project:     DYNAMIXEL-X430-Control-Table-Emulator
# Description: Checks of this library only (the generic workflows stay identical
#              to the family): unit tests for every emulated model, the Kconfig
#              build with a minimal fragment, and the end-to-end check with the
#              official ROBOTIS DynamixelSDK.
