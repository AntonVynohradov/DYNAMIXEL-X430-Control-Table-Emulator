name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.model }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [xm430_w350, xm430_w210, xh430_w350, xh430_w210, xh430_v350, xh430_v210,
                xd430_t350, xd430_t210, xw430_t333, xw430_t200, xl430_w250, 2xl430_w250,
                xc430_w150, xc430_w240, xc430_t150bb, xc430_t240bb, 2xc430_w250]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev
          pip install -r requirements.txt
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DX430_UNIT_TESTS=ON -DX430_KCONFIG=OFF -DX430_MODEL=${{ matrix.model }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  kconfig-and-coverage:
    name: Kconfig build, coverage, DynamixelSDK end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev
          pip install -r requirements-dev.txt
      - name: Unit tests with coverage (Kconfig defconfig)
        run: |
          cmake --preset "X430[UnitTests]"
          cmake --build "build/X430[UnitTests]" --target coverage
      - name: Examples and DynamixelSDK check
        run: |
          cmake --preset "X430[Examples]"
          cmake --build "build/X430[Examples]"
          tests/sdk/run_sdk_check.sh "build/X430[Examples]"
      - name: Minimal feature set
        run: |
          printf 'CONFIG_X430_MODEL_XW430_T333=y\nCONFIG_X430_FAST_READ=n\nCONFIG_X430_BULK=n\nCONFIG_X430_BACKUP=n\nCONFIG_X430_SIMULATOR=n\n' > min.conf
          cmake -S . -B build/min -G Ninja -DCMAKE_BUILD_TYPE=Release -DX430_CONF_FILES="$PWD/min.conf"
          cmake --build build/min

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: clang-format --dry-run --Werror src/*.c src/*.h inc/*.h x430.h examples/host_sim/*.c tests/unit/*.cpp tests/unit/*.h
