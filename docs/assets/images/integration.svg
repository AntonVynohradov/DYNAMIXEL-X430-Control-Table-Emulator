<text x="555" y="320" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#0B2545" text-anchor="middle">The bus lock (x430_port) separates the RX thread and the motor loop; hooks run inside x430_bus_receive() with the lock held.</text>
